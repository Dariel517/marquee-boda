<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent !important;
}

.marquee-container {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 58px;
    overflow: hidden;
    display: flex;
    align-items: center;
    background: rgba(0, 0, 0, 0.55);
}

.marquee {
    display: inline-block;
    white-space: nowrap;
    padding-left: 100vw;

    font-family: Arial, Helvetica, sans-serif;
    font-size: 28px;
    font-weight: 600;
    letter-spacing: 0.5px;
    color: #ffffff;

    text-shadow:
        1px 1px 2px rgba(0, 0, 0, 0.95),
        -1px -1px 1px rgba(0, 0, 0, 0.6);

    animation: desplazamiento 38s linear infinite;
    will-change: transform;
}

@keyframes desplazamiento {
    from {
        transform: translateX(0);
    }

    to {
        transform: translateX(-100%);
    }
}
</style>
</head>

<body>

<div class="marquee-container">
    <div class="marquee">
        3er Dia de NUESTRA BODA Martín &amp; Roberta
        &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
        PADRINOS DE RELIGIÓN Y CIVIL: Edmundo Colque y Sra. Carlota Rodríguez
        &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
        Producciones D-F: 1165756085
    </div>
</div>

</body>
</html>
