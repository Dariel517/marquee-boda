<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent !important;
    }

    .marquee-container {
        width: 100%;
        height: 100%;
        overflow: hidden;
        display: flex;
        align-items: center;
        background: transparent !important;
    }

    .marquee {
        display: inline-block;
        white-space: nowrap;
        color: #ffffff;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 42px;
        font-weight: 700;
        letter-spacing: 1px;
        text-shadow:
            2px 2px 3px rgba(0,0,0,0.95),
            -1px -1px 2px rgba(0,0,0,0.7);
        animation: mover 28s linear infinite;
        will-change: transform;
    }

    @keyframes mover {
        from {
            transform: translateX(100vw);
        }
        to {
            transform: translateX(-100%);
        }
    }
</style>
</head>

<body>

<div class="marquee-container">
    <div class="marquee">
        Nuestra Boda MARTIN &amp; ROBERTA
        &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
        Padrinos de Civil y Religion: EDMUNDO COLQUE Y Sra. CARLOTA RODRIGUEZ
        &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
        Producciones D-F: 1136479641
    </div>
</div>

</body>
</html>
